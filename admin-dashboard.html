<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZHCREATIONZ | Admin Dashboard</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="admin-container">
    <h1>ZHCREATIONZ</h1>
    <p>Seasonal Collection Management</p>

    <div class="login-box">
        <h2>Admin Dashboard</h2>
        <p>Manage your seasonal collections here.</p>

        <div id="admin-content">
            <h3>Create New Collection</h3>

            <form id="collection-form">
                <input type="text" id="collection-title"
                    placeholder="Collection name (e.g. Onam)" required>

                <textarea id="collection-description"
                    placeholder="Collection description"></textarea>

                <button type="submit">Add Collection</button>
            </form>

            <hr>

            <h3>Your Collections</h3>
            <div id="collections-list">
                Loading collections...
            </div>

            <div id="product-section" hidden>
                <hr>
                <h3 id="selected-collection-title"></h3>

                <form id="product-form">
                    <input type="text" id="product-name"
                        placeholder="Product name" required>

                    <textarea id="product-description"
                        placeholder="Product description"></textarea>

                    <input type="number" id="product-price"
                        placeholder="Price (optional)" min="0" step="0.01">

                    <input type="file" id="product-image"
                        accept="image/*" required>

                    <input type="tel" id="product-whatsapp"
                        placeholder="WhatsApp number with country code"
                        required>

                    <button type="submit">Add Product</button>
                </form>

                <div id="products-list"></div>
            </div>
        </div>

        <button id="logout-button" type="button">Logout</button>
        <p id="admin-message"></p>
    </div>
</div>

<script type="module" src="dashboard.js"></script>
</body>
</html>
